---
# Applies the per-camera dtoverlay for each configured sensor.
# The IMX462 is driven via the imx290 overlay (not imx462); other Raspberry Pi
# Camera Modules use their own overlay (imx708, imx219, imx477, ov5647, imx296,
# ...). Each configured camera is a mapping {id, overlay, overlay_params}.

- name: Check for firmware config.txt
  stat:
    path: /boot/firmware/config.txt
  register: firmware_stat

- name: Determine firmware config path
  set_fact:
    firmware_config: "{{ '/boot/firmware/config.txt' if firmware_stat.stat.exists else '/boot/config.txt' }}"

- name: Compute configured camera ids
  set_fact:
    configured_camera_ids: "{{ imx462_cameras | map(attribute='id') | list }}"

- name: Ensure overlay for each configured camera (Pi 5 pisp, camN suffix)
  lineinfile:
    path: "{{ firmware_config }}"
    regexp: '^dtoverlay=.*,cam{{ camera.id }}\s*$'
    line: "dtoverlay={{ camera.overlay }}{% if camera.overlay_params | default('') %},{{ camera.overlay_params }}{% endif %},cam{{ camera.id }}"
  loop: "{{ imx462_cameras }}"
  loop_control:
    loop_var: camera
  when: imx462_is_pi5_pisp

- name: Ensure overlay for each configured camera (csi platform, no camN suffix)
  # On the csi platform (Pi 3/4, Zero 2W) the imx290/imx327 overlays default to
  # Unicam 1 (the standard camera connector); 'cam0' there selects the Compute
  # Module CSI0 layout instead, so the suffix must be omitted.
  lineinfile:
    path: "{{ firmware_config }}"
    regexp: '^dtoverlay={{ camera.overlay }}(,[^\s]*)*\s*$'
    line: "dtoverlay={{ camera.overlay }}{% if camera.overlay_params | default('') %},{{ camera.overlay_params }}{% endif %}"
  loop: "{{ imx462_cameras }}"
  loop_control:
    loop_var: camera
  when: not imx462_is_pi5_pisp

- name: Remove stale overlays for unconfigured camera slots
  lineinfile:
    path: "{{ firmware_config }}"
    regexp: '^dtoverlay=.*,cam{{ item }}\s*$'
    state: absent
  loop: [0, 1]
  when: item not in configured_camera_ids
