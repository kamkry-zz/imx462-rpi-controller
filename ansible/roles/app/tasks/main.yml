---
# Installs dependencies, deploys the app, renders config/.env, installs systemd.

- name: Install apt dependencies
  apt:
    name:
      - python3-picamera2
      - python3-venv
      - prometheus-node-exporter
      # Remuxes recordings from raw H.264 to MP4 (`ffmpeg -c copy`). Lite
      # images (e.g. the Zero 2 W) ship without it, so recordings silently
      # stayed as .h264.
      - ffmpeg
    state: present
    update_cache: true

- name: Upgrade rpicam-apps to match the installed libcamera
  # Trixie images can ship rpicam-apps 1.13.0 against libcamera 0.7.2; the
  # ABI mismatch breaks `rpicam-hello` with an undefined-symbol error. 1.14.0
  # is built against the current libcamera. This only touches the CLI tools;
  # the controller uses Picamera2 directly.
  apt:
    name:
      - librpicam-app1
      - rpicam-apps-core
      - rpicam-apps-lite
    state: latest
    update_cache: true
  tags: [rpicam]

- name: Ensure node_exporter is enabled and running
  systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Determine if an imx290 (IMX462) camera is configured
  set_fact:
    imx462_has_imx290: "{{ (imx462_cameras | selectattr('overlay', 'equalto', 'imx290') | list | length) > 0 }}"

- name: Install vendor camera tuning file (replaces imx290.json for correct IMX462 colour)
  # The vendor tuning is Pi 5 / pisp-specific; on previous-gen pipelines (vc4,
  # e.g. Pi 3/4/Zero 2W) the stock imx290.json is kept as-is.
  # imx462_is_pi5_pisp is set by the play's pre_tasks.
  when:
    - imx462_has_imx290
    - imx462_is_pi5_pisp
  block:
    - name: Back up stock imx290 tuning file
      copy:
        src: /usr/share/libcamera/ipa/rpi/pisp/imx290.json
        dest: /usr/share/libcamera/ipa/rpi/pisp/imx290.json.rpi-default
        remote_src: true
        mode: "0644"
      failed_when: false
    - name: Install vendor tuning file as imx290.json
      copy:
        src: innomakerpi5_imx290.json
        dest: /usr/share/libcamera/ipa/rpi/pisp/imx290.json
        mode: "0644"
  notify: Restart imx462-controller

- name: Restore stock imx290 tuning on non-Pi 5 platforms (vendor file unused there)
  when:
    - imx462_has_imx290
    - not imx462_is_pi5_pisp
  block:
    - name: Restore stock pisp imx290.json from backup
      copy:
        src: /usr/share/libcamera/ipa/rpi/pisp/imx290.json.rpi-default
        dest: /usr/share/libcamera/ipa/rpi/pisp/imx290.json
        remote_src: true
        mode: "0644"
      failed_when: false

- name: Create app and media directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ imx462_service_user }}"
    mode: "0755"
  loop:
    - "{{ imx462_app_dir }}"
    - "{{ imx462_media_dir }}"

- name: Install k3s CA certificate for OTLP export (when configured)
  copy:
    src: k3s-ca.crt
    dest: "{{ imx462_env.OTEL_EXPORTER_OTLP_CERTIFICATE }}"
    mode: "0644"
  when:
    - imx462_env.OTEL_EXPORTER_OTLP_CERTIFICATE is defined
    - imx462_env.OTEL_EXPORTER_OTLP_CERTIFICATE | length > 0

- name: Create virtualenv with system site-packages
  command:
    cmd: "python3 -m venv --system-site-packages {{ imx462_venv }}"
    creates: "{{ imx462_venv }}/bin/python"

- name: Sync application source
  copy:
    src: "{{ playbook_dir }}/../src/"
    dest: "{{ imx462_app_dir }}/src/"

- name: Copy pyproject.toml
  copy:
    src: "{{ playbook_dir }}/../pyproject.toml"
    dest: "{{ imx462_app_dir }}/pyproject.toml"

- name: Install application package
  command:
    cmd: "{{ imx462_venv }}/bin/python -m pip install --no-cache-dir ."
    chdir: "{{ imx462_app_dir }}"

- name: Render config.yaml
  copy:
    content: "{{ imx462_config | to_nice_yaml }}"
    dest: "{{ imx462_app_dir }}/config.yaml"
    owner: "{{ imx462_service_user }}"
    mode: "0644"

- name: Render .env
  copy:
    content: |
      {% for key, value in imx462_env.items() %}
      {{ key }}={{ value }}
      {% endfor %}
    dest: "{{ imx462_app_dir }}/.env"
    owner: "{{ imx462_service_user }}"
    mode: "0600"

- name: Install systemd unit
  template:
    src: imx462-controller.service.j2
    dest: /etc/systemd/system/imx462-controller.service
    mode: "0644"

- name: Check for firmware cmdline.txt
  stat:
    path: /boot/firmware/cmdline.txt
  register: imx462_cmdline_stat
  when: imx462_enable_memory_cgroup | bool

- name: Enable the memory cgroup controller (kernel cmdline)
  # The Raspberry Pi firmware injects `cgroup_disable=memory`; without the
  # controller the unit's MemoryHigh/MemoryMax are silently ignored.
  # cmdline.txt is a single line: append the flag once, idempotently.
  replace:
    path: "{{ '/boot/firmware/cmdline.txt' if imx462_cmdline_stat.stat.exists else '/boot/cmdline.txt' }}"
    regexp: '^(?!.*\bcgroup_enable=memory\b)(.*\S)\s*$'
    replace: '\1 cgroup_enable=memory'
  register: imx462_cmdline_result
  when: imx462_enable_memory_cgroup | bool

- name: Warn that the memory cgroup needs a reboot
  debug:
    msg: >-
      cgroup_enable=memory was added to the kernel command line; reboot this Pi
      for the service memory limits to take effect.
  when: imx462_cmdline_result is changed

- name: Enable and start service
  systemd:
    name: imx462-controller
    enabled: true
    state: restarted
    daemon_reload: true
